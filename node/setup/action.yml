name: "node(quality assurance): Setup"
description: Check out the repository, set up Node.js from package.json and install dependencies with npm ci
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: "package.json"
        cache: "npm"

    - name: Install dependencies
      run: npm ci
      shell: bash
