name: "node(setup): Setup Node.js"
description: Set up Node.js from package.json and install dependencies with npm ci
inputs:
  working-directory:
    description: Directory holding package.json and package-lock.json. Defaults to the repository root; set it for a project in a monorepo subdirectory.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: "${{ inputs.working-directory }}/package.json"
        cache: "npm"
        cache-dependency-path: "${{ inputs.working-directory }}/package-lock.json"

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}
