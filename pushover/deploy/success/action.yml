name: "pushover(deploy): Success"
description: Notify Pushover that the deploy succeeded
inputs:
  api-key:
    description: Pushover application API token. Pass it from a secret.
    required: true
  user-key:
    description: Pushover user or group key to notify. Pass it from a secret.
    required: true
  name:
    description: What was deployed, shown in the notification. Defaults to the repository name; set it to tell apart projects deployed from one monorepo.
    required: false
    default: ${{ github.repository }}
runs:
  using: composite
  steps:
    - name: Send Pushover notification
      run: |
        curl -sS --fail-with-body -m 10 --retry 3 \
          --form-string "token=$API_KEY" \
          --form-string "user=$USER_KEY" \
          --form-string "title=🟢 $NAME deployed ($GITHUB_REF_NAME)" \
          --form-string "message=$NAME deployed from $GITHUB_REF_NAME (${GITHUB_SHA::7})" \
          --form-string "priority=0" \
          --form-string "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          --form-string "url_title=View workflow run" \
          https://api.pushover.net/1/messages.json
        echo
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        USER_KEY: ${{ inputs.user-key }}
        NAME: ${{ inputs.name }}
