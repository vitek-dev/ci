name: "pushover(workflows): Failed"
description: Notify Pushover, with high priority, that the workflow run failed
inputs:
  api-key:
    description: Pushover application API token. Pass it from a secret.
    required: true
  user-key:
    description: Pushover user or group key to notify. Pass it from a secret.
    required: true
runs:
  using: composite
  steps:
    - name: Send Pushover notification
      run: bash "$GITHUB_ACTION_PATH/../send.sh" failed
      shell: bash
      env:
        API_KEY: ${{ inputs.api-key }}
        USER_KEY: ${{ inputs.user-key }}
