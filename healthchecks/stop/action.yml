name: "healthchecks(monitor): Stop"
description: Signal Healthchecks.io that the job finished, as success or failure depending on the job status
inputs:
  url:
    description: Ping URL of the check, e.g. https://hc-ping.com/<uuid> (or your self-hosted instance). Pass it from a secret.
    required: true
  status:
    description: Job status to report; anything other than "success" is reported as a failure. Defaults to the current job.status.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Ping Healthchecks.io
      run: |
        if [[ "$STATUS" == success ]]; then suffix=""; else suffix="/fail"; fi
        echo "Reporting job status '$STATUS'"
        curl -sS --fail-with-body -m 10 --retry 5 --data-raw "$RUN_URL" "${URL%/}$suffix"
      shell: bash
      env:
        URL: ${{ inputs.url }}
        STATUS: ${{ inputs.status || job.status }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
