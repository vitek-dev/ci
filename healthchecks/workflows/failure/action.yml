name: "healthchecks(workflows): Failure"
description: Signal Healthchecks.io that the workflow run failed
inputs:
  url:
    description: Ping URL of the check, e.g. https://hc-ping.com/<uuid> (or your self-hosted instance). Pass it from a secret.
    required: true
runs:
  using: composite
  steps:
    - name: Ping Healthchecks.io
      run: bash "$GITHUB_ACTION_PATH/../ping.sh" "/fail"
      shell: bash
      env:
        URL: ${{ inputs.url }}
        RUN_ID: ${{ github.run_id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
