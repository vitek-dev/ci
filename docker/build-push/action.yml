name: "docker(build): Build & Push image"
description: Build the Dockerfile in the repository root and push it to ghcr.io as <image>:latest
inputs:
  image:
    description: Image name under ghcr.io, e.g. vitek-dev/app. Defaults to the repository name.
    required: false
    default: ${{ github.repository }}
runs:
  using: composite
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Build image
      run: docker build --file ./Dockerfile --tag "ghcr.io/${IMAGE,,}:latest" .
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}

    - name: Push image to Registry
      run: docker push "ghcr.io/${IMAGE,,}:latest"
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
