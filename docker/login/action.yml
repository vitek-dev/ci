name: "docker(login): Log in to the Container registry"
description: Log in to the GitHub Container registry (ghcr.io) as the workflow actor
inputs:
  registry:
    description: Container registry to log in to.
    required: false
    default: ghcr.io
  username:
    description: Registry username. Defaults to the user or app that triggered the workflow.
    required: false
    default: ${{ github.actor }}
  password:
    description: Registry password or token. Defaults to the workflow's GITHUB_TOKEN.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
